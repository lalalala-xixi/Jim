<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务代办</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f4f6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
    }

    .todo {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .todo-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid #eef0f3;
    }

    .todo-header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .todo-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .sort-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #ffffff;
      font: inherit;
      font-size: 12px;
      color: #4f7cff;
      white-space: nowrap;
      cursor: pointer;
    }

    .sort-btn:hover {
      border-color: #4f7cff;
      background: #f5f8ff;
    }

    .sort-btn:active {
      background: #eef2ff;
    }

    .todo-header p {
      margin-top: 6px;
      font-size: 13px;
      color: #8a94a6;
    }

    .todo-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 12px;
      color: #8a94a6;
    }

    .stats-rate {
      font-weight: 600;
      color: #4f7cff;
    }

    .stats-bar {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: #eef2ff;
      overflow: hidden;
    }

    .stats-bar span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #4f7cff;
      transition: width 0.2s ease;
    }

    .overdue-notice {
      padding: 10px 24px;
      border-bottom: 1px solid #fee2e2;
      background: #fef2f2;
      font-size: 12px;
      color: #dc2626;
    }

    .overdue-notice[hidden] {
      display: none;
    }

    .todo-list {
      list-style: none;
      padding: 8px 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #f4f5f7;
    }

    .todo-item:not(.done) {
      cursor: pointer;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f7cff;
      flex-shrink: 0;
      cursor: default;
      pointer-events: none;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .todo-text .title {
      display: block;
    }

    .due {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #4f7cff;
    }

    .due[hidden] {
      display: none;
    }

    .due.overdue {
      color: #dc2626;
    }

    .tag {
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #eef2ff;
      color: #4f7cff;
    }

    .tag.done {
      background: #f0f2f5;
      color: #9aa3b2;
    }

    .todo-item.done .todo-text {
      color: #9aa3b2;
    }

    .todo-item.done .title {
      text-decoration: line-through;
    }

    .deadline {
      padding: 16px 24px 20px;
      border-top: 1px solid #eef0f3;
    }

    .deadline h2 {
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #8a94a6;
    }

    .task-name-input {
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fafbfc;
      font: inherit;
      font-size: 14px;
      color: #1f2937;
    }

    .deadline-row {
      display: flex;
      gap: 8px;
    }

    .deadline-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fafbfc;
      font: inherit;
      font-size: 14px;
      color: #1f2937;
    }

    .deadline-row input:focus,
    .task-name-input:focus {
      outline: none;
      border-color: #4f7cff;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.12);
    }

    .deadline-row button {
      flex-shrink: 0;
      padding: 9px 18px;
      border: none;
      border-radius: 10px;
      background: #4f7cff;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .deadline-row button:hover {
      background: #3f6af0;
    }

    .deadline-hint {
      min-height: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: #8a94a6;
    }

    .deadline-hint.error {
      color: #e05656;
    }

    .todo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      border-top: 1px solid #eef0f3;
      font-size: 12px;
      color: #8a94a6;
    }

    .complete-all-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #ffffff;
      font: inherit;
      font-size: 12px;
      color: #4f7cff;
      cursor: pointer;
    }

    .complete-all-btn:hover:not(:disabled) {
      border-color: #4f7cff;
      background: #f5f8ff;
    }

    .complete-all-btn:disabled {
      border-color: #eef0f3;
      background: #fafbfc;
      color: #b6bdc9;
      cursor: default;
    }

    .clear-btn {
      flex-shrink: 0;
      margin-left: auto;
      padding: 6px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #ffffff;
      font: inherit;
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
    }

    .clear-btn:hover {
      border-color: #dc2626;
      background: #230404;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <main class="todo">
    <header class="todo-header">
      <div class="todo-header-top">
        <h1>任务代办</h1>
        <div class="header-actions">
          <button class="sort-btn" id="exportBtn" type="button">导出</button>
          <button class="sort-btn" id="sortBtn" type="button" title="点击按截止时间排序，再次点击反向排序">按截止时间 早→晚</button>
        </div>
      </div>
      <p>今天是 11 月 9 日，共 <span id="taskCount">5</span> 项任务</p>
      <div class="todo-stats">
        <span>完成率 <strong class="stats-rate" id="doneRate">40%</strong></span>
        <div class="stats-bar" aria-hidden="true"><span id="statsBar"></span></div>
      </div>
    </header>

    <div class="overdue-notice" id="overdueNotice" aria-live="polite" hidden></div>
    

    <ul class="todo-list">
      <li class="todo-item done" data-id="t1">
        <input type="checkbox" checked disabled />
        <div class="todo-text">
          <span class="title">整理本周的工作计划</span>
          <span class="due" hidden></span>
        </div>
        <span class="tag done">已完成</span>
      </li>
      <li class="todo-item done" data-id="t2">
        <input type="checkbox" checked disabled />
        <div class="todo-text">
          <span class="title">阅读 Git 基础教程</span>
          <span class="due" hidden></span>
        </div>
        <span class="tag done">已完成</span>
      </li>
      <li class="todo-item" data-id="t3">
        <input type="checkbox" disabled />
        <div class="todo-text">
          <span class="title">练习提交与分支操作</span>
          <span class="due" hidden></span>
        </div>
        <span class="tag">进行中</span>
      </li>
      <li class="todo-item" data-id="t4">
        <input type="checkbox" disabled />
        <div class="todo-text">
          <span class="title">编写项目说明文档</span>
          <span class="due" hidden></span>
        </div>
        <span class="tag">待开始</span>
      </li>
      <li class="todo-item" data-id="t5">
        <input type="checkbox" disabled />
        <div class="todo-text">
          <span class="title">回顾今天的学习笔记</span>
          <span class="due" hidden></span>
        </div>
        <span class="tag">待开始</span>
      </li>
    </ul>

    <section class="deadline">
      <h2>添加任务</h2>
      <input class="task-name-input" id="taskNameInput" type="text" placeholder="输入任务名称" autocomplete="off" aria-label="任务名称" />
      <div class="deadline-row">
        <input id="dueInput" type="datetime-local" value="2026-11-10T18:00" aria-label="截止时间" />
        <button id="saveDeadline" type="button">保存</button>
      </div>
      <p class="deadline-hint" id="deadlineHint" aria-live="polite"></p>
    </section>

    <footer class="todo-footer">
      <span id="footerStats">已完成 2 项 · 还剩 3 项</span>
      <button class="clear-btn" id="clearBtn" type="button">清空</button>
      <button class="complete-all-btn" id="completeAllBtn" type="button">全部完成</button>
    </footer>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'todo-deadlines';
      var saved = {};

      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
      } catch (error) {
        saved = {};
      }

      var nameInput = document.getElementById('taskNameInput');
      var input = document.getElementById('dueInput');
      var button = document.getElementById('saveDeadline');
      var hint = document.getElementById('deadlineHint');
      var notice = document.getElementById('overdueNotice');
      var items = Array.prototype.slice.call(document.querySelectorAll('.todo-item'));

      var defaultDue = new Date();
      defaultDue.setDate(defaultDue.getDate() + 1);
      defaultDue.setHours(18, 0, 0, 0);

      var pad = function (value) {
        return value < 10 ? '0' + value : String(value);
      };

      input.value = defaultDue.getFullYear() + '-' +
        pad(defaultDue.getMonth() + 1) + '-' +
        pad(defaultDue.getDate()) + 'T' + pad(defaultDue.getHours()) + ':' + pad(defaultDue.getMinutes());

      function formatDeadline(value) {
        var parts = value.split('T');
        var date = parts[0].split('-');
        return Number(date[1]) + '月' + Number(date[2]) + '日 ' + parts[1];
      }

      function deadlineTime(item) {
        var value = saved[item.getAttribute('data-id')];
        if (!value) {
          return null;
        }
        var time = new Date(value).getTime();
        return isNaN(time) ? null : time;
      }

      function isOverdue(item) {
        var time = deadlineTime(item);
        return time !== null && time < Date.now();
      }

      function renderDue(item) {
        var due = item.querySelector('.due');
        var value = saved[item.getAttribute('data-id')];

        if (value) {
          var overdue = isOverdue(item) && !item.classList.contains('done');
          due.textContent = (overdue ? '已过期 · ' : '截止 ') + formatDeadline(value);
          due.classList.toggle('overdue', overdue);
          due.hidden = false;
        } else {
          due.textContent = '';
          due.classList.remove('overdue');
          due.hidden = true;
        }
      }

      function updateNotice() {
        var count = items.filter(function (item) {
          return !item.classList.contains('done') && isOverdue(item);
        }).length;

        notice.hidden = count === 0;
        notice.textContent = count === 0 ? '' : '有 ' + count + ' 项任务已过期，请及时处理';
      }

      function refreshAll() {
        items.forEach(renderDue);
        updateNotice();
      }

      refreshAll();

      var list = document.querySelector('.todo-list');
      var sortButton = document.getElementById('sortBtn');
      var sortAscending = true;

      function sortByDeadline(ascending) {
        var ordered = items.slice().sort(function (a, b) {
          var timeA = deadlineTime(a);
          var timeB = deadlineTime(b);

          if (timeA === timeB) {
            return 0;
          }
          if (timeA === null) {
            return 1;
          }
          if (timeB === null) {
            return -1;
          }
          return ascending ? timeA - timeB : timeB - timeA;
        });

        ordered.forEach(function (item) {
          list.appendChild(item);
        });
        items = ordered;
      }

      function updateSortButton() {
        sortButton.textContent = sortAscending ? '按截止时间 早→晚' : '按截止时间 晚→早';
      }

      sortButton.addEventListener('click', function () {
        var hasDeadline = items.some(function (item) {
          return deadlineTime(item) !== null;
        });

        if (!hasDeadline) {
          showHint('还没有设置截止时间，先为任务设置截止时间', true);
          return;
        }

        sortByDeadline(sortAscending);
        showHint(sortAscending ? '已按截止时间从早到晚排序' : '已按截止时间从晚到早排序', false);
        sortAscending = !sortAscending;
        updateSortButton();
      });

      updateSortButton();

      function showHint(message, isError) {
        hint.textContent = message;
        hint.classList.toggle('error', Boolean(isError));
      }

      button.addEventListener('click', function () {
        var name = nameInput.value.replace(/\s+/g, ' ').trim();

        if (!name) {
          showHint('请输入任务名称', true);
          nameInput.focus();
          return;
        }

        if (!input.value) {
          showHint('请先选择截止时间', true);
          return;
        }

        var item = findItemByName(name);
        var isNew = !item;

        if (isNew) {
          item = createTask(name);
        }

        var id = item.getAttribute('data-id');

        saved[id] = input.value;
        renderDue(item);
        updateNotice();
        updateStats();

        var stored = true;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        } catch (error) {
          stored = false;
        }

        if (!stored) {
          showHint('已更新显示，但浏览器阻止了本地保存', true);
        } else if (isNew) {
          showHint('已添加任务「' + name + '」并保存截止时间', false);
          nameInput.value = '';
        } else if (!item.classList.contains('done') && isOverdue(item)) {
          showHint('已保存，但「' + name + '」的截止时间已过期', true);
        } else {
          showHint('已保存「' + name + '」的截止时间', false);
        }
      });

      nameInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          button.click();
        }
      });

      var completeAllButton = document.getElementById('completeAllBtn');
      var clearButton = document.getElementById('clearBtn');
      var footerStats = document.getElementById('footerStats');
      var taskCount = document.getElementById('taskCount');
      var doneRate = document.getElementById('doneRate');
      var statsBar = document.getElementById('statsBar');

      function updateStats() {
        var doneCount = items.filter(function (item) {
          return item.classList.contains('done');
        }).length;

        footerStats.textContent = '已完成 ' + doneCount + ' 项 · 还剩 ' + (items.length - doneCount) + ' 项';
        taskCount.textContent = items.length;
        completeAllButton.disabled = doneCount === items.length;

        var rate = items.length === 0 ? 0 : Math.round((doneCount / items.length) * 100);
        doneRate.textContent = rate + '%';
        statsBar.style.width = rate + '%';
      }

      function markDone(item) {
        item.classList.add('done');
        item.querySelector('input[type="checkbox"]').checked = true;

        var tag = item.querySelector('.tag');
        tag.textContent = '已完成';
        tag.classList.add('done');
      }

      var taskSeq = items.reduce(function (max, item) {
        var number = Number(item.getAttribute('data-id').replace('t', ''));
        return isNaN(number) ? max : Math.max(max, number);
      }, 0);

      function findItemByName(name) {
        var target = name.toLowerCase();

        for (var i = 0; i < items.length; i += 1) {
          var text = items[i].querySelector('.title').textContent.replace(/\s+/g, ' ').trim();

          if (text.toLowerCase() === target) {
            return items[i];
          }
        }

        return null;
      }

      function createTask(name) {
        taskSeq += 1;

        var id = 't' + taskSeq;
        var item = document.createElement('li');

        item.className = 'todo-item';
        item.setAttribute('data-id', id);
        item.innerHTML = '<input type="checkbox" disabled />' +
          '<div class="todo-text"><span class="title"></span><span class="due" hidden></span></div>' +
          '<span class="tag">待开始</span>';
        item.querySelector('.title').textContent = name;

        list.appendChild(item);
        items.push(item);
        bindTask(item);

        return item;
      }

      function bindTask(item) {
        item.addEventListener('click', function () {
          if (item.classList.contains('done')) {
            return;
          }

          markDone(item);
          updateStats();
          refreshAll();
        });
      }

      items.forEach(bindTask);

      completeAllButton.addEventListener('click', function () {
        items.forEach(markDone);
        updateStats();
        refreshAll();
      });

      clearButton.addEventListener('click', function () {
        items = items.filter(function (item) {
          if (!item.classList.contains('done')) {
            return true;
          }

          item.remove();
          return false;
        });

        updateStats();
        refreshAll();
      });

      var exportButton = document.getElementById('exportBtn');

      exportButton.addEventListener('click', function () {
        var now = new Date();
        var datePart = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
        var timePart = pad(now.getHours()) + ':' + pad(now.getMinutes());
        var lines = ['任务代办', '导出时间：' + datePart + ' ' + timePart, ''];

        if (items.length === 0) {
          lines.push('（暂无任务）');
        }

        items.forEach(function (item, index) {
          var done = item.classList.contains('done');
          var value = saved[item.getAttribute('data-id')];
          var line = (index + 1) + '. [' + (done ? '已完成' : '未完成') + '] ' +
            item.querySelector('.title').textContent.trim();

          if (value) {
            line += '（截止 ' + formatDeadline(value);

            if (!done && isOverdue(item)) {
              line += '，已过期';
            }

            line += '）';
          }

          lines.push(line);
        });

        var doneCount = items.filter(function (item) {
          return item.classList.contains('done');
        }).length;

        lines.push('');
        lines.push('已完成 ' + doneCount + ' 项 · 还剩 ' + (items.length - doneCount) + ' 项');

        var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');

        link.href = url;
        link.download = '任务清单-' + datePart + '.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });

      updateStats();

      setInterval(refreshAll, 30000);
    })();
  </script>
</body>
</html>
