<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务代办</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f4f6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
    }

    .todo {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .todo-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid #eef0f3;
    }

    .todo-header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .todo-header p {
      margin-top: 6px;
      font-size: 13px;
      color: #8a94a6;
    }

    .todo-list {
      list-style: none;
      padding: 8px 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #f4f5f7;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f7cff;
      flex-shrink: 0;
      cursor: default;
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
    }

    .tag {
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #eef2ff;
      color: #4f7cff;
    }

    .tag.done {
      background: #f0f2f5;
      color: #9aa3b2;
    }

    .todo-item.done .todo-text {
      color: #9aa3b2;
      text-decoration: line-through;
    }

    .deadline {
      padding: 16px 24px 20px;
      border-top: 1px solid #eef0f3;
    }

    .deadline h2 {
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #8a94a6;
    }

    .deadline-row {
      display: flex;
      gap: 8px;
    }

    .deadline-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fafbfc;
      font: inherit;
      font-size: 14px;
      color: #1f2937;
    }

    .deadline-row input:focus {
      outline: none;
      border-color: #4f7cff;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.12);
    }

    .deadline-row button {
      flex-shrink: 0;
      padding: 9px 18px;
      border: none;
      border-radius: 10px;
      background: #4f7cff;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .deadline-row button:hover {
      background: #3f6af0;
    }

    .todo-footer {
      padding: 16px 24px;
      border-top: 1px solid #eef0f3;
      font-size: 12px;
      color: #8a94a6;
    }
  </style>
</head>
<body>
  <main class="todo">
    <header class="todo-header">
      <h1>任务代办</h1>
      <p>今天是 11 月 9 日，共 5 项任务</p>
    </header>

    <ul class="todo-list">
      <li class="todo-item done">
        <input type="checkbox" checked disabled />
        <span class="todo-text">整理本周的工作计划</span>
        <span class="tag done">已完成</span>
      </li>
      <li class="todo-item done">
        <input type="checkbox" checked disabled />
        <span class="todo-text">阅读 Git 基础教程</span>
        <span class="tag done">已完成</span>
      </li>
      <li class="todo-item">
        <input type="checkbox" disabled />
        <span class="todo-text">练习提交与分支操作</span>
        <span class="tag">进行中</span>
      </li>
      <li class="todo-item">
        <input type="checkbox" disabled />
        <span class="todo-text">编写项目说明文档</span>
        <span class="tag">待开始</span>
      </li>
      <li class="todo-item">
        <input type="checkbox" disabled />
        <span class="todo-text">回顾今天的学习笔记</span>
        <span class="tag">待开始</span>
      </li>
    </ul>

    <section class="deadline">
      <h2>添加截止时间</h2>
      <div class="deadline-row">
        <input type="datetime-local" value="2026-11-10T18:00" aria-label="截止时间" />
        <button type="button">添加</button>
      </div>
    </section>

    <footer class="todo-footer">
      已完成 2 项 · 还剩 3 项
    </footer>
  </main>
</body>
</html>
